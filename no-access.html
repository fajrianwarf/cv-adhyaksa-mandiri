<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Access Restricted — Website Temporarily Unavailable</title>
  <!-- Prevent indexing while paused -->
  <meta name="robots" content="noindex, nofollow, noarchive">
  <style>
    :root{
      --primary:#da2419; /* brand red */
      --bg:#fafbfe;
      --text:#0f172a;
      --muted:#64748b;
      --card:#fff;
      --radius:14px;
    }
    *{box-sizing:border-box}
    html,body{height:100%}
    body{
      margin:0;
      display:grid;
      place-items:center;
      background: radial-gradient(900px 500px at -10% -40%, rgba(218,36,25,.06), transparent 60%),
                  radial-gradient(800px 400px at 120% 20%, rgba(218,36,25,.05), transparent 60%),
                  linear-gradient(180deg,#fff 0%, var(--bg) 100%);
      font: 15px/1.6 system-ui, -apple-system, Segoe UI, Roboto, Inter, Arial, sans-serif;
      color:var(--text);
      padding:24px;
    }
    .card{
      width:min(680px, 100%);
      background:var(--card);
      border:1px solid #e8ecf5;
      border-radius:var(--radius);
      box-shadow:0 10px 30px rgba(2,6,23,.08);
      padding:24px;
    }
    .header{
      display:flex; gap:14px; align-items:center;
      margin-bottom:6px;
    }
    .icon{
      width:54px; height:54px; border-radius:14px;
      display:grid; place-items:center; flex:0 0 auto;
      background:linear-gradient(180deg, #fff, #fff8f8);
      border:1px solid #f1d3d1;
      box-shadow:0 6px 18px rgba(218,36,25,.12);
    }
    .icon svg{width:26px; height:26px; color:var(--primary)}
    h1{margin:0; font-size:20px; color:var(--primary); letter-spacing:.3px}
    p{margin:.4rem 0; color:var(--muted)}
    .actions{display:flex; flex-wrap:wrap; gap:10px; margin-top:12px}
    .btn{
      display:inline-flex; gap:8px; align-items:center; justify-content:center;
      padding:10px 14px; border-radius:10px; text-decoration:none; font-weight:700;
      border:1px solid #e8ecf5; background:#fff; color:#0f172a;
    }
    .btn--wa{border-color:rgba(37,211,102,.25); background:linear-gradient(180deg,#fff,#f7fff9); color:#187a44}
    .btn--mail{}
    .note{
      margin-top:12px; font-size:13px; color:#8a94a7;
    }
    footer{margin-top:16px; font-size:12px; color:#8a94a7}
    .mono{font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;}
  </style>
</head>
<body>
  <main class="card" role="main" aria-labelledby="title">
    <div class="header">
      <div class="icon" aria-hidden="true">
        <!-- lock icon -->
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <rect x="3" y="11" width="18" height="10" rx="2"></rect>
          <path d="M7 11V8a5 5 0 0 1 10 0v3"></path>
          <circle cx="12" cy="16" r="1.7"></circle>
        </svg>
      </div>
      <div>
        <h1 id="title">Access Restricted</h1>
        <p>Sorry, this website is <strong>temporarily unavailable</strong>.</p>
      </div>
    </div>

    <!-- <p>If you need access or have questions about the site, please contact the owner using one of the options below.</p>

    <div class="actions">
      <a class="btn btn--wa" href="https://wa.me/6285225664407" target="_blank" rel="noopener">Contact via WhatsApp</a>
      <a class="btn btn--mail" href="mailto:cvam190609@gmail.com">Email the owner</a>
    </div>

    <p class="note">While paused, this page uses <span class="mono">noindex, nofollow</span> so search engines won't index it.</p> -->
    <footer>© <span id="year"></span> — This site is intentionally paused.</footer>
  </main>
  <script>
    document.getElementById('year').textContent = new Date().getFullYear();
  </script>
</body>
</html>
